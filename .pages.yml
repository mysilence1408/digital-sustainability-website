                required: true
          - name: energy
            label: Energy
            type: object
            required: true
            fields:
              - name: src
                label: Src
                type: image
                required: true
                options:
                  media: images
                pattern:
                  regex: ^/images/.+
                  message: Choose an image from the media library.
              - name: alt
                label: Alt
                type: string
                required: true
      - name: paragraphs
        label: Paragraphs
        type: text
        required: true
        list:
          min: 1
      - name: video
        label: Video
        type: object
        required: true
        fields:
          - name: src
            label: Src
            type: file
            required: false
            options:
              media: videos
            description: Upload a video, or leave this blank when a direct hosted URL is provided.
          - name: poster
            label: Poster
            type: image
            required: true
            options:
              media: images
            pattern:
              regex: ^/images/.+
              message: Choose an image from the media library.
          - name: title
            label: Title
            type: string
            required: true
            list:
              min: 2
              max: 2
          - name: subtitle
            label: Subtitle
            type: string
            required: true
          - name: url
            label: Url
            type: string
            required: false
            description: >-
              Optional direct HTTPS video URL (MP4/WebM). Overrides the uploaded file. Not a YouTube page
              link.
            pattern:
              regex: ^(https://[^\s]+)?$
              message: Use a direct HTTPS URL, or leave blank to use the uploaded video.
          - name: label
            label: Label
            type: string
            required: true
      - name: metadata
        label: Search / browser title
        type: object
        required: true
        fields:
          - name: title
            label: Page title
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true
