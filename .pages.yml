media:
  - name: images
    label: Images
    input: public/images
    output: /images
    rename: safe
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
      - gif
      - svg
  - name: videos
    label: Videos
    input: public/videos
    output: /videos
    rename: safe
    extensions:
      - mp4
      - webm
